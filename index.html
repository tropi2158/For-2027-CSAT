:root{color-scheme:light dark;--bg:light-dark(#f4f5f7,#0f1114);--card:light-dark(#fff,#181b20);--ink:light-dark(#111418,#eceef1);--mute:light-dark(#6b7280,#9aa1ab);--line:light-dark(#e4e6ea,#2a2e35);--soft:light-dark(#f1f3f6,#21252c);--acc:light-dark(#2457e6,#6b93ff);--accs:light-dark(#eaf0ff,#1b2540);--ok:light-dark(#11804a,#4ccf8a);--oks:light-dark(#e7f6ee,#15291f);--no:light-dark(#d03a2c,#ff7a6b);--nos:light-dark(#fdecea,#33191a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}

.wrap{max-width:760px;margin:0 auto;padding:0 max(4vw,14px) 56px}

h1 span{color:var(--mute);font-weight:500}
.tr{display:flex;align-items:center;gap:8px}
.stat{font-size:13px;color:var(--mute);white-space:nowrap}.stat b{color:var(--ink);font-weight:600}
.ib{height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;white-space:nowrap}
.ib .cnt{background:var(--acc);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px}

.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:2px}

mjx-container[display=true]{margin:.3em 0!important}

.sh{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 10px}

.list{overflow-y:auto;padding:4px 18px 30px;display:grid;gap:10px;align-content:start;flex:1}
.nt{padding:16px}
.nt .meta{margin-bottom:8px}

.nt summary{cursor:pointer;color:var(--acc);font-weight:600;font-size:13px}
.nt textarea{margin-top:10px;width:100%;min-height:56px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:8px 10px;font-size:14px;resize:vertical}
.nt .del{margin-left:auto;border:0;background:none;color:var(--mute);cursor:pointer;font-size:13px;padding:4px 6px}

.empty{color:var(--mute);text-align:center;padding:40px 10px;font-size:14px}
/* 풀이 필기 칸 */
.padw{margin-top:20px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.padh{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 10px;background:var(--soft);border-bottom:1px solid var(--line)}
.padh .t{font-size:13px;font-weight:700;margin-right:4px}
.tb{height:34px;min-width:34px;padding:0 10px;border-radius:9px;border:1px solid transparent;background:none;cursor:pointer;font-size:13px;font-weight:600;color:var(--mute);display:inline-flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap}
.tb[aria-pressed=true]{background:var(--card);color:var(--ink);border-color:var(--line)}
.sw{width:16px;height:16px;border-radius:50%;display:block}
.sp{flex:1}
.fing{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--mute);cursor:pointer}
.fing input{accent-color:var(--acc)}
#pad{display:block;width:100%;height:340px;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:contain;cursor:crosshair;background-color:var(--card);background-image:linear-gradient(var(--soft) 1px,transparent 1px),linear-gradient(90deg,var(--soft) 1px,transparent 1px);background-size:24px 24px}
#pad.er{cursor:none}
.padbox{position:relative}
.ering{position:absolute;display:none;pointer-events:none;border-radius:50%;border:1.5px solid var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent);transform:translate(-50%,-50%);box-shadow:0 0 0 1px var(--card)}
.padtip{font-size:12px;color:var(--mute);padding:6px 10px;border-top:1px solid var(--line);background:var(--soft)}
.eh{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.eh[aria-pressed=true]{background:var(--acc)!important;color:#fff!important;border-color:var(--acc)!important}
.mini{display:block;width:100%;margin-top:10px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
@media(max-width:600px){.top{flex-wrap:wrap;padding-bottom:12px}.tr{width:100%;justify-content:space-between}.fr{grid-template-columns:minmax(0,1fr)}.ch{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.ch li:last-child{grid-column:1/-1}.bar .r{width:100%}.bar .r .pb{flex:1}}
@media(prefers-reduced-motion:reduce){.sheet,.scrim{transition:none}}

<div class="wrap">

<h1>기초 문제 <span>대수 · 미적분Ⅰ</span></h1>
<div class="tr"><span class="stat" id="stat"></span><button class="ib" id="openNotes" aria-label="노트 열기">노트 <span class="cnt" id="ncnt">0</span></button></div>
</div>
<div class="card filters">

</div>
<div class="fr"><div class="seg" id="lvl"></div><div class="seg" id="mode"></div></div>
</div>
<article class="card q" id="paper" aria-live="polite"></article>
<p class="foot">숫자가 매번 바뀌는 자동 생성 문제 · 노트와 기록은 이 브라우저에 저장돼요 · 키보드 1~5 선택, H 힌트, Enter 다음 문제</p>
</div>

</div>
<div class="list" id="list"></div>
</aside>
<script>
{
const T=String.raw;
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const nz=(a,b)=>{let v;do v=R(a,b);while(v===0);return v};
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a||1};
const F=(n,d=1)=>{if(d<0){n=-n;d=-d}const g=gcd(n,d);return{n:n/g,d:d/g}};
const add=(a,b)=>F(a.n*b.d+b.n*a.d,a.d*b.d);
const tx=f=>{if(typeof f==='number')f=F(f);if(f.d===1)return ''+f.n;return (f.n<0?'-':'')+'\\frac{'+Math.abs(f.n)+'}{'+f.d+'}'};
const P=terms=>{let s='';for(const [c,v] of terms){if(c===0)continue;const a=Math.abs(c);const body=(a===1&&v)?v:(a+v);if(!s)s=(c<0?'-':'')+body;else s+=(c<0?' - ':' + ')+body}return s||'0'};
const sg=n=>n===0?'':(n>0?' + '+n:' - '+(-n));
const pr=n=>n<0?'('+n+')':''+n;
const fpi=f=>{if(f.n===0)return '0';const s=f.n<0?'-':'',a=Math.abs(f.n);if(f.d===1)return s+(a===1?'':a)+'\\pi';return s+'\\frac{'+(a===1?'':a)+'\\pi}{'+f.d+'}'};
const xm=r=>'x'+sg(-r);
const cf=(c)=>c===1?'':c===-1?'-':''+c;

/* 삼각함수 표 (π/6 단위) */
const SN=[F(0),F(1,2),null,F(1),null,F(1,2),F(0),F(-1,2),null,F(-1),null,F(-1,2)];
const CS=[F(1),null,F(1,2),F(0),F(-1,2),null,F(-1),null,F(-1,2),F(0),F(1,2),null];
const ang=tb=>{let k;do k=R(0,11);while(!tb[k]);return [k+pick([0,0,12,-12]),tb[k]]};
const SV=()=>{const [n,d]=pick([[1,2],[1,3],[2,3],[1,5],[3,5],[1,4],[3,4]]);return [pick([1,-1])*n,d]};

/* 미분용 삼차함수 */
const cub=()=>{const a=R(-3,3),b=R(-4,4),c=R(-3,3);return{a,b,c,t:P([[1,'x^{3}'],[a,'x^{2}'],[b,'x'],[c,'']]),v:x=>x**3+a*x*x+b*x+c,d:x=>3*x*x+2*a*x+b}};
const arg=(r,c)=>r===0?P([[c,'h']]):r+(c<0?'-':'+')+(Math.abs(c)===1?'':Math.abs(c))+'h';

const DATA={
alg:{name:'대수',units:[
{name:'지수와 로그',parts:[
{name:'거듭제곱근',g:[
()=>{const n=pick([3,4]),k=n===3?R(2,6):R(2,4),a=R(1,n-1),u=k**a,v=k**(n-a);
return{q:T`\(\sqrt[${n}]{${u}}\times\sqrt[${n}]{${v}}\)의 값은?`,a:F(k),s:T`\(\sqrt[${n}]{${u}\times${v}}=\sqrt[${n}]{${k}^{${n}}}=${k}\)`}},
()=>{const s=pick([-8,-6,-5,-3,3,5,7,10]),N=R(5,12);let t=0;for(let n=2;n<=N;n++)t+=n%2?1:(s>0?2:0);
return{q:T`2 이상 ${N} 이하의 자연수 \(n\)에 대하여 \(${s}\)의 \(n\)제곱근 중 실수인 것의 개수를 \(f(n)\)이라 할 때, \(f(2)+f(3)+\cdots+f(${N})\)의 값은?`,a:F(t),s:T`${s>0?'양수':'음수'}의 \(n\)제곱근 중 실수인 것은 \(n\)이 홀수이면 1개, 짝수이면 ${s>0?'2개':'0개'}입니다. 짝수 ${Math.floor(N/2)}개, 홀수 ${Math.floor((N-1)/2)}개를 더하면 ${t}입니다.`}},
()=>{const a=R(3,6),b=a+R(1,4),N=b+R(1,3);let t=0;for(let n=2;n<=N;n++){const v=(n-a)*(n-b);t+=v===0?1:v>0?(n%2?1:2):(n%2?1:0)}
return{q:T`2 이상 ${N} 이하의 자연수 \(n\)에 대하여 \(${P([[1,'n^{2}'],[-(a+b),'n'],[a*b,'']])}\)의 \(n\)제곱근 중 실수인 것의 개수를 \(f(n)\)이라 하자. \(f(2)+f(3)+\cdots+f(${N})\)의 값은?`,a:F(t),s:T`주어진 식은 \((n-${a})(n-${b})\)입니다. \(n<${a}\) 또는 \(n>${b}\)이면 양수(홀수 1개, 짝수 2개), \(${a}<n<${b}\)이면 음수(홀수 1개, 짝수 0개), \(n=${a},\,${b}\)이면 0이므로 1개입니다. 모두 더하면 ${t}입니다.`}}]},
{name:'지수',g:[
()=>{const b=pick([2,3]),m=b===2?pick([2,3,4]):pick([2,3]);let p,q,d;do{p=R(1,2*m);d=R(0,2);q=p-d}while(p%m===0||q<1);const g=gcd(p,m),N=b**m;
return{q:T`\(${N}^{\frac{${p/g}}{${m/g}}}\times${b}^{-${q}}\)의 값은?`,a:F(b**d),s:T`\(${N}=${b}^{${m}}\)이므로 \(${N}^{\frac{${p/g}}{${m/g}}}=${b}^{${p}}\). 따라서 \(${b}^{${p}-${q}}=${b}^{${d}}=${b**d}\)`}},
()=>{const k=R(2,6),A=F(k*k-k+1,k);return{q:T`양수 \(a\)와 실수 \(x\)에 대하여 \(a^{2x}=${k}\)일 때, \(\dfrac{a^{3x}+a^{-3x}}{a^{x}+a^{-x}}\)의 값은?`,a:A,s:T`\(A^{3}+B^{3}=(A+B)(A^{2}-AB+B^{2})\)를 쓰면 주어진 식은 \(a^{2x}-1+a^{-2x}=${k}-1+\frac{1}{${k}}=${tx(A)}\)`}},
()=>{const c=pick([2,3]),k=pick([12,18,24,30,36,40,48,60,72]),h=k/2,L=[];for(let n=2;n<=h;n++)if(h%n===0)L.push(n);
return{q:T`\(\left(\sqrt{${c}^{${k}}}\right)^{\frac{1}{n}}\)의 값이 자연수가 되도록 하는 2 이상의 자연수 \(n\)의 개수는?`,a:F(L.length),s:T`\(\left(\sqrt{${c}^{${k}}}\right)^{\frac{1}{n}}=${c}^{\frac{${h}}{n}}\)이 자연수이려면 \(n\)이 ${h}의 약수여야 합니다. 2 이상인 약수는 ${L.join(', ')}로 ${L.length}개입니다.`}}]},
{name:'로그',g:[
()=>{const b=pick([2,3,5]),n=R(1,3),y=pick([3,6,7,10,11].filter(v=>v%b)),x=b**n*y;

const HINTS={
'거듭제곱근':[T`같은 \(n\)제곱근끼리는 근호 안을 곱할 수 있어요: \(\sqrt[n]{a}\sqrt[n]{b}=\sqrt[n]{ab}\)`,T`실수인 \(n\)제곱근의 개수는 \(n\)의 홀짝과 수의 부호로 정해져요.`,T`식을 인수분해해서 \(n\)의 범위별로 부호를 따져 보세요. 0의 \(n\)제곱근은 0 하나뿐이에요.`],
'지수':[T`큰 수를 밑의 거듭제곱으로 바꿔 지수끼리 계산하세요.`,T`\(a^{x}=A,\ a^{-x}=B\)로 두고 \(A^{3}+B^{3}\)의 인수분해를 떠올리세요.`,T`식을 \(c^{(\text{지수})}\) 꼴로 정리하고, 지수가 자연수가 될 조건을 찾으세요.`],
'로그':[T`\(\log_a x-\log_a y=\log_a\frac{x}{y}\)`,T`밑 변환: \(\log_a b\times\log_b c=\log_a c\), \(\log_{a^m}b^n=\frac{n}{m}\log_a b\)`,T`\(\log_2 a=s,\ \log_2 b=t\)로 두면 구하는 값은 \(\frac{s^2+t^2}{st}\), \(s^2+t^2=(s+t)^2-2st\)`],
'지수함수':[T`\(x\)에 값을 직접 대입하세요.`,T`밑이 1보다 작으면 감소함수 → 구간 양 끝에서 최대·최소`,T`\(2^{x}=t\)로 치환하면 \(t\)의 이차함수예요. \(t\)의 범위부터 구하세요.`],
'로그함수':[T`진수가 밑의 거듭제곱이 되는지 보세요.`,T`\(y=\log_2(x-a)+b\)의 점근선은 \(x=a\)`,T`\(\log_2 x=t\)로 치환, \(\log_2 x^{k}=k\log_2 x\)`],
'방정식·부등식':[T`양변의 밑을 같게 만들면 지수끼리 비교할 수 있어요.`,T`진수 조건(진수 \(>0\))을 먼저 챙기세요.`,T`밑이 1보다 작으면 지수의 부등호 방향이 반대!`],
'호도법·부채꼴':[T`\(180^{\circ}=\pi\)`,T`부채꼴의 넓이 \(S=\frac{1}{2}rl\)`,T`호의 길이를 (둘레 \(-\,2r\))로 두고 넓이를 \(r\)의 이차함수로`],
'삼각함수의 값':[T`\(2\pi\)의 정수배를 더하거나 빼서 \(0\sim2\pi\) 사이 각으로 바꾸세요.`,T`양변을 제곱하고 \(\sin^2\theta+\cos^2\theta=1\)을 쓰세요.`,T`제곱해서 \(\sin\theta\cos\theta\)부터 구하세요. \(\tan\theta+\frac{1}{\tan\theta}=\frac{1}{\sin\theta\cos\theta}\)`],
'삼각함수의 그래프':[T`\(-1\le\sin x\le1\), \(-1\le\cos x\le1\)`,T`최댓값 \(a+c\), 최솟값 \(-a+c\), 주기 \(\frac{2\pi}{b}\)`,T`\(\sin^2x+\cos^2x=1\)로 한 종류의 함수로 통일한 뒤 인수분해`],
'사인·코사인법칙':[T`코사인법칙 \(a^2=b^2+c^2-2bc\cos A\)`,T`사인법칙 \(\frac{a}{\sin A}=2R\)`,T`코사인법칙으로 \(\cos A\) → \(\sin A\) → 사인법칙 순서로`],
'등차수열':[T`공차 \(d=\frac{a_3-a_1}{2}\), \(a_n=a_1+(n-1)d\)`,T`\(a_1,\ d\)를 구한 뒤 \(S_n=\frac{n\{2a_1+(n-1)d\}}{2}\)`,T`공차가 음수면 양수(또는 0)인 항까지 더할 때 합이 최대`],
'등비수열':[T`공비 \(r=\frac{a_2}{a_1}\), \(a_n=a_1r^{n-1}\)`,T`\(\frac{a_5}{a_2}=r^{3}\)`,T`\(S_6-S_3=r^{3}S_3\), \(S_9-S_6=r^{6}S_3\)`],
'합의 기호 ∑':[T`\(\sum k=\frac{n(n+1)}{2}\), 상수의 합은 \(cn\)`,T`\(\sum k^2=\frac{n(n+1)(2n+1)}{6}\), ∑는 항별로 나눌 수 있어요.`,T`부분분수로 나누거나 유리화해서 소거되는 항을 찾으세요.`],
'귀납적 정의':[T`\(a_2\)부터 차례로 대입하세요.`,T`짝수/홀수 조건을 확인하며 한 항씩 계산`,T`마지막 항부터 거꾸로: 앞 항은 \(2a\), 또는 홀수 조건을 만족하는 다른 값`],
'극한 계산':[T`분자를 인수분해해 \((x-a)\)를 약분`,T`\(\infty-\infty\) 꼴은 유리화, \(\frac{\infty}{\infty}\) 꼴은 최고차항으로 나누기`,T`\(x\to-\infty\)면 \(x=-t\)로 치환 / 근호가 있는 \(\frac{0}{0}\) 꼴은 유리화`],
'미정계수':[T`분모 \(\to0\)이고 극한값이 존재하면 분자 \(\to0\)`,T`분자는 \((x-a)\)를 인수로 가져요.`,T`첫 조건으로 최고차·이차항 계수, 둘째 조건으로 상수항과 일차항 계수`],
'연속':[T`\(x\ne a\)일 때 식을 약분해 극한값을 구하세요.`,T`경계점에서 좌극한 = 우극한 = 함숫값`,T`\(f\)가 불연속인 점에서 \(g\)가 0이어야 \(fg\)가 연속`],
'미분계수':[T`미분계수의 정의 그대로 \(f'(a)\)`,T`\(f(a)\)를 빼고 더해서 두 극한으로 나누세요.`,T`분자에 \(r f(r)\)을 빼고 더해서 정리`],

'최대·최소':[T`이차함수는 꼭짓점에서 최대`,T`극값과 구간 양 끝 값을 모두 비교`,T`길이를 \(x\)로 나타내 넓이(부피) 함수를 세우고 미분`],
'부정적분':[T`\(f'\)을 적분하고 \(f(0)\)으로 적분상수 결정`,T`\(f(x)=x^3+ax^2+C\)로 두고 두 조건 대입`,T`\(x=1\)을 넣으면 좌변은 0. 그다음 양변을 미분`],

'속도와 거리':[T`위치 \(=\int_0^{t}v(t)\,dt\)`,T`움직인 거리 \(=\int|v(t)|\,dt\), 방향이 바뀌는 시각에서 구간 나누기`,T`원점으로 돌아오는 시각은 위치 \(x(t)=0\)`]

{const s=ls('gicho-sel',null);if(s&&DATA[s.subj])Object.assign(st,{subj:s.subj,unit:Math.min(s.unit,DATA[s.subj].units.length-1),part:s.part,lvl:s.lvl,mode:s.mode,auto:s.auto!==false})}

  const L=notes.filter(n=>st.nf==='all'||(st.nf==='wrong'&&n.wrong)||(st.nf==='memo'&&n.memo&&n.memo.trim()));
  $('list').innerHTML=L.length?L.map(n=>`<div class="card nt" data-id="${esc(n.id)}"><div class="meta"><span class="pill">${n.lv}점</span><span>${esc(n.path)}</span>${n.wrong?'<span class="tag">틀림</span>':''}<button class="del" data-del="${esc(n.id)}">삭제</button></div>
  <div class="qt">${n.q}</div>${n.h?`<details><summary>힌트</summary>${n.h}</details>`:''}<details><summary>정답·해설</summary><b>답 \\(${n.a}\\)</b><br>${n.s}</details>
  ${n.st&&n.st.length?`<canvas class="mini" data-pv="${esc(n.id)}"></canvas>`:''}<textarea data-memo="${esc(n.id)}" placeholder="메모">${esc(n.memo||'')}</textarea></div>`).join(''):`<div class="empty">${notes.length?'조건에 맞는 노트가 없어요.':'아직 저장한 문제가 없어요.<br>문제 아래 ‘노트에 저장’을 누르거나, 틀린 문제가 자동으로 모여요.'}</div>`;
  $('nf').innerHTML=seg([['all','전체'],['wrong','틀린 문제'],['memo','메모 있음']],st.nf,'nf');
  $('auto').checked=st.auto;
  typeset($('list'));
  document.querySelectorAll('canvas[data-pv]').forEach(cv=>{const n=notes.find(x=>x.id===cv.dataset.pv);if(!n)return;let my=0;for(const k of n.st)for(const p of k.p)my=Math.max(my,p[1]);const W=cv.clientWidth,kk=W/1000,H=Math.max(60,Math.min(n.ph,my+40)*kk),d=devicePixelRatio||1;cv.width=W*d;cv.height=H*d;cv.style.height=H+'px';const x=cv.getContext('2d');x.setTransform(d,0,0,d,0,0);paint(x,n.st,kk)});
}
const openNotes=o=>{document.body.classList.toggle('open',o);if(o){noteList();$('closeNotes').focus()}else{render()}};
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.s!==undefined){if(d.s!==st.subj){st.subj=d.s;st.unit=0;st.part=-1;save();controls();newQ()}}
  else if(d.l!==undefined){st.lvl=+d.l;save();controls();newQ()}
  else if(d.m!==undefined){if(st.mode!==d.m){st.mode=d.m;save();controls();render()}}
  else if(d.c!==undefined){const i=+d.c,v=st.cur.ch[i];grade(v.n===st.cur.a.n&&v.d===st.cur.a.d,i)}
  else if(d.nf!==undefined){st.nf=d.nf;noteList()}
  else if(d.del!==undefined){notes=notes.filter(n=>n.id!==d.del);save();controls();noteList()}
  else if(b.id==='next')newQ();
  else if(b.id==='show')grade(false,null,true);
  else if(b.id==='hintB'){st.hint=!st.hint;render()}
  else if(b.id==='noteB'){if(savedNote())notes=notes.filter(n=>n.id!==st.cur.id);else addNote(st.cur.res==='bad');save();controls();render();const m=$('memo');m&&m.focus()}
  else if(b.id==='openNotes')openNotes(true);
  else if(b.id==='closeNotes')openNotes(false);
});
$('scrim').addEventListener('click',()=>openNotes(false));
$('unit').addEventListener('change',e=>{st.unit=+e.target.value;st.part=-1;save();controls();newQ()});
$('part').addEventListener('change',e=>{st.part=+e.target.value;save();controls();newQ()});
$('auto').addEventListener('change',e=>{st.auto=e.target.checked;save()});
$('list').addEventListener('input',e=>{const id=e.target.dataset.memo;if(id===undefined)return;const n=notes.find(x=>x.id===id);if(n){n.memo=e.target.value;save()}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&document.body.classList.contains('open')){openNotes(false);return}
  if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||document.body.classList.contains('open'))return;
  if(/^[1-5]$/.test(e.key)&&st.mode==='mc'&&!st.done){const b=document.querySelector(`.ch button[data-c="${+e.key-1}"]`);b&&b.click()}
  else if((e.key==='h'||e.key==='H')&&st.cur.h){st.hint=!st.hint;render()}
  else if(e.key==='Enter'&&st.done){e.preventDefault();newQ()}
});
/* ---------- 풀이 필기 칸 ---------- */
const PAD=Object.assign({open:true,color:'ink',finger:true,es:40},ls('gicho-pad',{}));
const savePad=()=>lsw('gicho-pad',{open:PAD.open,color:PAD.color,finger:PAD.finger,es:PAD.es});
const ES=[[24,'소'],[40,'중'],[64,'대']];
let sticky=false,hold=false,holdUsed=false,holdT=0,api=null;
const colorOf=k=>k==='blue'?'#2f6bff':k==='red'?'#e0443a':getComputedStyle(document.body).color;
const penErase=e=>e&&e.pointerType==='pen'&&(e.buttons&34);
const erasing=e=>sticky||hold||!!penErase(e);
function paint(x,strokes,k){
  x.lineCap='round';x.lineJoin='round';
  for(const s of strokes){
    x.globalCompositeOperation=s.t?'destination-out':'source-over';x.strokeStyle=x.fillStyle=s.t?'#000':colorOf(s.c);
    const p=s.p,wd=q=>s.t?s.w*k:Math.max(.6,s.w*k*(.5+q[2]));
    if(p.length===1){x.beginPath();x.arc(p[0][0]*k,p[0][1]*k,wd(p[0])/2,0,7);x.fill();continue}
    for(let i=1;i<p.length;i++){x.beginPath();x.lineWidth=wd(p[i]);x.moveTo(p[i-1][0]*k,p[i-1][1]*k);x.lineTo(p[i][0]*k,p[i][1]*k);x.stroke()}
  }
  x.globalCompositeOperation='source-over';
}
function padHTML(){
  const sw=c=>`<button class="tb" data-pc="${c}" aria-label="${c==='ink'?'검정':c==='blue'?'파랑':'빨강'} 펜"><span class="sw" style="background:${c==='ink'?'var(--ink)':colorOf(c)}"></span></button>`;
  return `<div class="padw"><div class="padh"><span class="t">풀이 노트</span>${PAD.open?`${sw('ink')}${sw('blue')}${sw('red')}<button class="tb eh" id="ehB" title="누르는 동안 지우개 · 짧게 누르면 고정">지우개</button><button class="tb" id="esB">크기 ${ES.find(v=>v[0]===PAD.es)[1]}</button><button class="tb" id="undoB">되돌리기</button><button class="tb" id="clrB">전체 지우기</button><button class="tb" id="moreB">칸 늘리기</button><label class="fing"><input type="checkbox" id="fingB"${PAD.finger?' checked':''}>손가락으로 쓰기</label>`:''}<span class="sp"></span><button class="tb" id="padT">${PAD.open?'접기':'펼치기'}</button></div>${PAD.open?`<div class="padbox"><canvas id="pad" aria-label="풀이 필기 칸"></canvas><div class="ering" id="ering"></div></div><div class="padtip">지우개 버튼을 누르고 있는 동안 지우개, 떼면 펜으로 돌아와요. 짧게 누르면 지우개 고정 · S펜/스타일러스 버튼, 키보드 E도 지원</div>`:''}</div>`;
}
function padUI(){
  const er=sticky||hold;
  document.querySelectorAll('[data-pc]').forEach(b=>b.setAttribute('aria-pressed',!er&&PAD.color===b.dataset.pc));
  const e=$('ehB');if(e){e.setAttribute('aria-pressed',er);e.textContent=sticky?'지우개 고정':'지우개'}
  const z=$('esB');if(z)z.textContent='크기 '+ES.find(v=>v[0]===PAD.es)[1];
  const cv=$('pad');if(cv)cv.classList.toggle('er',er);
}
let padRO=null;
function syncNote(){const n=savedNote();if(n){n.st=st.cur.strokes;n.ph=st.cur.ph;save()}}
function setupPad(){
  padRO&&padRO.disconnect();padRO=null;api=null;
  const cv=$('pad');if(!cv)return;const ring=$('ering'),c=st.cur;c.strokes=c.strokes||[];c.padH=c.padH||340;
  let W=1,kk=1,cur=null;
  const redraw=()=>{const x=cv.getContext('2d');x.clearRect(0,0,cv.width,cv.height);paint(x,c.strokes,kk)};
  const fit=()=>{W=cv.clientWidth||1;kk=W/1000;c.ph=c.padH/kk;const d=devicePixelRatio||1;cv.style.height=c.padH+'px';cv.width=W*d;cv.height=c.padH*d;cv.getContext('2d').setTransform(d,0,0,d,0,0);redraw()};
  padRO=new ResizeObserver(fit);padRO.observe(cv);fit();api={redraw,fit};
  const rel=e=>{const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]};
  const pt=e=>{const [x,y]=rel(e);return [Math.round(x/kk*10)/10,Math.round(y/kk*10)/10,e.pointerType==='pen'?Math.round((e.pressure||.5)*100)/100:.5]};
  const showRing=e=>{if(erasing(e)||(cur&&cur.t)){const [x,y]=rel(e);ring.style.display='block';ring.style.width=ring.style.height=PAD.es+'px';ring.style.left=x+'px';ring.style.top=y+'px'}else ring.style.display='none'};
  ['touchstart','touchmove'].forEach(t=>cv.addEventListener(t,e=>e.preventDefault(),{passive:false}));
  cv.addEventListener('contextmenu',e=>e.preventDefault());
  cv.addEventListener('pointerdown',e=>{
    e.preventDefault();
    if(!PAD.finger&&e.pointerType==='touch')return;
    if(e.pointerType==='mouse'&&e.button!==0)return;
    cv.setPointerCapture(e.pointerId);if(hold)holdUsed=true;
    const er=erasing(e);
    cur={t:er?1:0,c:PAD.color,w:er?PAD.es/kk:2.4/kk,p:[pt(e)],id:e.pointerId};c.strokes.push(cur);
    paint(cv.getContext('2d'),[{...cur}],kk);showRing(e);
  });
  cv.addEventListener('pointermove',e=>{
    showRing(e);if(!cur||e.pointerId!==cur.id)return;e.preventDefault();
    const evs=e.getCoalescedEvents?e.getCoalescedEvents():[];const x=cv.getContext('2d');
    for(const ev of (evs.length?evs:[e])){const q=pt(ev),p=cur.p[cur.p.length-1];if(Math.abs(q[0]-p[0])+Math.abs(q[1]-p[1])<.8)continue;cur.p.push(q);paint(x,[{t:cur.t,c:cur.c,w:cur.w,p:[p,q]}],kk)}
  });
  const end=e=>{if(cur&&e.pointerId===cur.id){cur=null;syncNote()}showRing(e)};
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  cv.addEventListener('pointerleave',()=>{if(!cur)ring.style.display='none'});
  const eh=$('ehB');
  eh.addEventListener('pointerdown',e=>{e.preventDefault();eh.setPointerCapture(e.pointerId);hold=true;holdUsed=false;holdT=Date.now();padUI()});
  const rel2=()=>{if(!hold)return;hold=false;if(!holdUsed&&Date.now()-holdT<300)sticky=!sticky;else if(holdUsed)sticky=false;padUI();ring.style.display='none'};
  eh.addEventListener('pointerup',rel2);eh.addEventListener('pointercancel',rel2);eh.addEventListener('contextmenu',e=>e.preventDefault());
  padUI();
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.pc){PAD.color=b.dataset.pc;sticky=false;savePad();padUI()}
  else if(b.id==='esB'){const i=ES.findIndex(v=>v[0]===PAD.es);PAD.es=ES[(i+1)%ES.length][0];savePad();padUI()}
  else if(b.id==='undoB'){st.cur.strokes&&st.cur.strokes.pop();syncNote();api&&api.redraw()}
  else if(b.id==='clrB'){if(st.cur.strokes)st.cur.strokes.length=0;syncNote();api&&api.redraw()}
  else if(b.id==='moreB'){st.cur.padH=(st.cur.padH||340)+240;api&&api.fit();syncNote()}
  else if(b.id==='padT'){PAD.open=!PAD.open;savePad();render()}
});
document.addEventListener('change',e=>{if(e.target.id==='fingB'){PAD.finger=e.target.checked;savePad()}});
document.addEventListener('keydown',e=>{if((e.key==='e'||e.key==='E')&&!e.repeat&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)&&$('pad')){hold=true;holdUsed=true;padUI()}});
document.addEventListener('keyup',e=>{if(e.key==='e'||e.key==='E'){if(hold){hold=false;padUI()}}});
controls();newQ();
}
</script>
